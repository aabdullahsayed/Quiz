<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive HTML Problem-Solving Quiz (Up to Links & Images)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-container {
      background: #ffffff;
      width: 100%;
      max-width: 740px;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .quiz-header {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      padding: 22px 28px;
    }

    .quiz-header h1 {
      font-size: 1.45rem;
      margin-bottom: 4px;
    }

    .quiz-header p {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.25);
      height: 8px;
      border-radius: 999px;
      margin-top: 14px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: #fde047;
      height: 100%;
      width: 5%;
      transition: width 0.3s ease;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-top: 8px;
      font-weight: 600;
    }

    .quiz-body {
      padding: 28px;
    }

    .badge-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .topic-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .type-badge {
      display: inline-block;
      background: #fef3c7;
      color: #b45309;
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .question-text {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .code-snippet {
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: 10px;
      font-family: Consolas, Monaco, 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 18px;
      overflow-x: auto;
      border: 1px solid #334155;
      white-space: pre-wrap;
    }

    .inline-code-editor {
      background: #0f172a;
      color: #38bdf8;
      padding: 18px;
      border-radius: 10px;
      font-family: Consolas, Monaco, 'Courier New', monospace;
      font-size: 1.05rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      border: 2px solid #334155;
    }

    .code-input {
      background: #1e293b;
      color: #fde047;
      border: 2px solid #60a5fa;
      border-radius: 6px;
      padding: 4px 10px;
      font-family: Consolas, Monaco, 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 700;
      width: 130px;
      outline: none;
    }

    .code-input:focus {
      border-color: #fde047;
      box-shadow: 0 0 0 3px rgba(253, 224, 71, 0.25);
    }

    .code-input.correct-input {
      border-color: #22c55e;
      background: #14532d;
      color: #bbf7d0;
    }

    .code-input.wrong-input {
      border-color: #ef4444;
      background: #7f1d1d;
      color: #fecaca;
    }

    .builder-assembly {
      min-height: 54px;
      background: #0f172a;
      border: 2px dashed #475569;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-family: Consolas, Monaco, monospace;
      color: #94a3b8;
    }

    .builder-tokens {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .token-chip {
      background: #eff6ff;
      color: #1e40af;
      border: 2px solid #93c5fd;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .token-chip:hover:not(:disabled) {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .token-chip:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .assembled-chip {
      background: #1e293b;
      color: #fde047;
      border: 1px solid #64748b;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .action-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .secondary-btn {
      background: #e2e8f0;
      color: #334155;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary-btn:hover:not(:disabled) {
      background: #cbd5e1;
    }

    .secondary-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    code.inline {
      background: #f1f5f9;
      color: #be123c;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.92em;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 0.98rem;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.correct .option-letter {
      background: #16a34a;
      color: #ffffff;
    }

    .option-btn.wrong .option-letter {
      background: #dc2626;
      color: #ffffff;
    }

    .option-code {
      font-family: Consolas, Monaco, monospace;
      font-size: 0.93rem;
    }

    .feedback-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.94rem;
      line-height: 1.5;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct-fb {
      background: #f0fdf4;
      border-left: 4px solid #16a34a;
      color: #166534;
    }

    .feedback-box.wrong-fb {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #991b1b;
    }

    .browser-preview {
      margin-top: 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      color: #0f172a;
    }

    .browser-bar {
      background: #e2e8f0;
      padding: 5px 10px;
      font-size: 0.75rem;
      color: #475569;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
      display: inline-block;
    }

    .browser-content {
      padding: 10px 14px;
      font-size: 0.92rem;
    }

    .quiz-footer {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }

    .primary-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .primary-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .primary-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .result-screen {
      text-align: center;
      padding: 8px 0;
    }

    .score-circle {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: #eff6ff;
      border: 6px solid #2563eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 18px;
    }

    .score-circle .score-num {
      font-size: 1.95rem;
      font-weight: 800;
      color: #1d4ed8;
    }

    .score-circle .score-total {
      font-size: 0.9rem;
      color: #475569;
      font-weight: 600;
    }

    .result-title {
      font-size: 1.45rem;
      margin-bottom: 6px;
    }

    .result-msg {
      color: #475569;
      margin-bottom: 20px;
      font-size: 0.98rem;
    }

    .review-list {
      text-align: left;
      margin-top: 22px;
      border-top: 1px solid #e2e8f0;
      padding-top: 18px;
      max-height: 320px;
      overflow-y: auto;
    }

    .review-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.88rem;
      background: #f8fafc;
      border-left: 4px solid #cbd5e1;
    }

    .review-item.ok {
      border-left-color: #16a34a;
    }

    .review-item.bad {
      border-left-color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="quiz-header">
      <h1>Interactive HTML Tag Problem Lab</h1>
      <p>20 Easy Hands-On Challenges &bull; Structure, Text, Lists, Links &amp; Images</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-row">
        <span id="questionCounter">Challenge 1 of 20</span>
        <span id="scoreCounter">Score: 0</span>
      </div>
    </div>

    <div class="quiz-body" id="quizBody"></div>
  </div>

  <script>
    const quizData = [
      {
        type: "mcq",
        topic: "Document Structure",
        badge: "Scenario Fix",
        question: "Maya wrote <h1>My Portfolio</h1> inside <body>, so it appears on the page, but the browser tab still says 'index.html'. Where should she add <title>My Portfolio</title> to fix the tab?",
        options: [
          { text: "Inside the <head> section", correct: true },
          { text: "Inside <body> right above <h1>", correct: false },
          { text: "Before the <!DOCTYPE html> line", correct: false },
          { text: "Inside the <h1> tag itself", correct: false }
        ],
        explanation: "The <title> element belongs inside <head>—it sets the browser tab label rather than page text.",
        previewTitle: "My Portfolio",
        previewHTML: "<span style='color:#64748b;font-size:0.85rem;'>Tab title updates to <strong>My Portfolio</strong>!</span>"
      },
      {
        type: "fill",
        topic: "Document Structure",
        badge: "Complete the Code",
        question: "Line 1 of an HTML5 file tells the browser which version of HTML you are using. Type the missing word to complete the declaration:",
        prefix: "<!",
        suffix: " html>",
        placeholder: "word",
        accepted: ["doctype", "<!doctype html>"],
        displayAnswer: "DOCTYPE",
        explanation: "<!DOCTYPE html> is required at the very top of every modern HTML5 document."
      },
      {
        type: "mcq",
        topic: "Document Structure",
        badge: "Bug Hunt",
        question: "Alex saved this file and opened it in Chrome, but the page is completely blank. Why isn't the paragraph showing up?",
        code: "<html>\n  <head>\n    <p>Welcome to my shop!</p>\n  </head>\n</html>",
        options: [
          { text: "Visible elements like <p> must be placed inside a <body> tag, not <head>", correct: true },
          { text: "Paragraph tags cannot contain exclamation marks", correct: false },
          { text: "The <html> tag must be written in uppercase", correct: false },
          { text: "The <head> tag needs an href attribute first", correct: false }
        ],
        explanation: "Only metadata like <title> goes in <head>. Everything the user sees on the page must be inside <body>."
      },
      {
        type: "mcq",
        topic: "Headings",
        badge: "Real-World Layout",
        question: "You are building an article page. 'Space Exploration' should be the main page title, and 'Mars Rovers' should be a smaller section subheading below it. Which pair of tags fits best?",
        options: [
          { text: "<h1>Space Exploration</h1> and <h2>Mars Rovers</h2>", isCode: true, correct: true },
          { text: "<h6>Space Exploration</h6> and <h1>Mars Rovers</h1>", isCode: true, correct: false },
          { text: "<head>Space Exploration</head> and <p>Mars Rovers</p>", isCode: true, correct: false },
          { text: "<title>Space Exploration</title> and <h5>Mars Rovers</h5>", isCode: true, correct: false }
        ],
        explanation: "<h1> is the largest, top-level heading, while <h2> is used for major subheadings underneath it.",
        previewHTML: "<h2 style='margin:0 0 4px 0;'>Space Exploration</h2><h4 style='margin:0;color:#334155;'>Mars Rovers</h4>"
      },
      {
        type: "builder",
        topic: "Paragraphs",
        badge: "Build the Tag",
        question: "Click the code blocks in the correct order to build a valid paragraph that displays: Hello World",
        tokens: ["</p>", "Hello World", "<p>"],
        correctOrder: ["<p>", "Hello World", "</p>"],
        explanation: "HTML elements wrap content between an opening <p> tag and a closing </p> tag.",
        previewHTML: "<p style='margin:0;'>Hello World</p>"
      },
      {
        type: "mcq",
        topic: "Paragraphs & Breaks",
        badge: "Predict the Output",
        question: "Sam pressed Enter inside his code editor like this:\nHow will the browser display it, and how can he force 'Line 2' onto a new line inside the same paragraph?",
        code: "<p>Line 1\nLine 2</p>",
        options: [
          { text: "It renders on one line; add <br> right after Line 1", correct: true },
          { text: "It automatically renders on two separate lines", correct: false },
          { text: "It renders on one line; add <lb> after Line 1", correct: false },
          { text: "It causes a syntax error until </br> is added", correct: false }
        ],
        explanation: "HTML collapses line breaks in source code into a single space. Use the empty <br> tag to break lines.",
        previewHTML: "Line 1<br>Line 2"
      },
      {
        type: "fill",
        topic: "Paragraphs & Breaks",
        badge: "Complete the Code",
        question: "You want to draw a horizontal divider line between the introduction and the main story. Type the 2-letter HTML tag name:",
        prefix: "<",
        suffix: ">",
        placeholder: "tag",
        accepted: ["hr", "<hr>"],
        displayAnswer: "hr",
        explanation: "<hr> stands for Horizontal Rule and draws a horizontal line across the container.",
        previewHTML: "<span>Intro</span><hr style='margin:6px 0;'><span>Main Story</span>"
      },
      {
        type: "mcq",
        topic: "Text Formatting",
        badge: "Scenario Fix",
        question: "On a cooking blog, you want the warning word HOT! to appear in bold inside this sentence:\n<p>Careful, the pan is ___!</p>\nWhich snippet works properly?",
        options: [
          { text: "<b>HOT!</b>", isCode: true, correct: true },
          { text: "<bold>HOT!</bold>", isCode: true, correct: false },
          { text: "<i>HOT!</i>", isCode: true, correct: false },
          { text: "<u>HOT!</u>", isCode: true, correct: false }
        ],
        explanation: "HTML uses <b> (or <strong>) for bold text—there is no <bold> tag.",
        previewHTML: "Careful, the pan is <b>HOT!</b>"
      },
      {
        type: "mcq",
        topic: "Text Formatting",
        badge: "Bug Hunt",
        question: "Liam tried to italicize a movie title using <italic>Inception</italic>, but the browser showed plain normal text. Which tag should replace <italic>?",
        options: [
          { text: "<i>Inception</i>", isCode: true, correct: true },
          { text: "<u>Inception</u>", isCode: true, correct: false },
          { text: "<b>Inception</b>", isCode: true, correct: false },
          { text: "<it>Inception</it>", isCode: true, correct: false }
        ],
        explanation: "The <i> tag (or <em>) italicizes text in HTML. Unknown tags like <italic> are ignored by browsers.",
        previewHTML: "Favorite movie: <i>Inception</i>"
      },
      {
        type: "fill",
        topic: "Text Formatting",
        badge: "Complete the Code",
        question: "Fill in the missing closing tag letter so only the word 'Note' is underlined:",
        prefix: "<u>Note</",
        suffix: "> Read carefully.",
        placeholder: "tag",
        accepted: ["u", "</u>"],
        displayAnswer: "u",
        explanation: "Every opening <u> tag should be closed with </u> where the underline should stop.",
        previewHTML: "<u>Note</u> Read carefully."
      },
      {
        type: "mcq",
        topic: "Lists",
        badge: "Real-World Layout",
        question: "You are creating a bulleted packing list (Tent, Flashlight, Map) where item order doesn't matter. Which HTML structure creates bullet points?",
        options: [
          { text: "<ul><li>Tent</li><li>Flashlight</li><li>Map</li></ul>", isCode: true, correct: true },
          { text: "<ol><li>Tent</li><li>Flashlight</li><li>Map</li></ol>", isCode: true, correct: false },
          { text: "<list><item>Tent</item><item>Flashlight</item></list>", isCode: true, correct: false },
          { text: "<ul><p>Tent</p><p>Flashlight</p><p>Map</p></ul>", isCode: true, correct: false }
        ],
        explanation: "<ul> (Unordered List) creates a bulleted list, with each entry wrapped inside <li> (List Item).",
        previewHTML: "<ul style='margin-left:18px;'><li>Tent</li><li>Flashlight</li><li>Map</li></ul>"
      },
      {
        type: "mcq",
        topic: "Lists",
        badge: "Bug Hunt",
        question: "Look at this Top 2 Games numbered list. Why won't it display properly as numbered items?",
        code: "<ol>\n  <ul>Minecraft</ul>\n  <ul>Tetris</ul>\n</ol>",
        options: [
          { text: "Each item inside <ol> must use <li>...</li> instead of <ul>", correct: true },
          { text: "<ol> only works for bullet points, not numbers", correct: false },
          { text: "Numbered lists must use <nl> instead of <ol>", correct: false },
          { text: "The <ol> tag requires a start='1' attribute to work", correct: false }
        ],
        explanation: "Both <ol> (ordered) and <ul> (unordered) require <li> tags for their list items."
      },
      {
        type: "builder",
        topic: "Adding Links",
        badge: "Build the Tag",
        question: "Assemble the HTML code to create a clickable link to https://google.com with the label: Search",
        tokens: ["Search", "<a href=\"https://google.com\">", "</a>"],
        correctOrder: ["<a href=\"https://google.com\">", "Search", "</a>"],
        explanation: "An anchor tag starts with <a href=\"URL\">, followed by the clickable link text, and closes with </a>.",
        previewHTML: "<a href='#' onclick='return false;' style='color:#2563eb;text-decoration:underline;'>Search</a>"
      },
      {
        type: "mcq",
        topic: "Adding Links",
        badge: "Bug Hunt",
        question: "Priya wrote this link, and the word 'Wikipedia' shows up on the page, but clicking it does nothing! How do you fix it?",
        code: "<a src=\"https://wikipedia.org\">Wikipedia</a>",
        options: [
          { text: "Change src to href", correct: true },
          { text: "Change <a> to <link>", correct: false },
          { text: "Change <a> to <url>", correct: false },
          { text: "Add alt=\"Wikipedia\" inside <a>", correct: false }
        ],
        explanation: "Links (<a>) use href (Hypertext Reference) for the destination URL—src is used for images (<img>)."
      },
      {
        type: "fill",
        topic: "Adding Links",
        badge: "Complete the Code",
        question: "Visitors complain that clicking your external help link navigates away from your website. Fill in the target value so it opens in a new browser tab:",
        prefix: "<a href=\"https://example.com\" target=\"",
        suffix: "\">Help</a>",
        placeholder: "_value",
        accepted: ["_blank"],
        displayAnswer: "_blank",
        explanation: "Setting target=\"_blank\" tells the browser to open the linked page in a new tab."
      },
      {
        type: "mcq",
        topic: "Adding Links",
        badge: "Scenario Fix",
        question: "Your website folder has two files side by side: index.html and contact.html. Which code links from index.html to contact.html?",
        options: [
          { text: "<a href=\"contact.html\">Contact Us</a>", isCode: true, correct: true },
          { text: "<a href=\"contact\">Contact Us</a>", isCode: true, correct: false },
          { text: "<link href=\"contact.html\">Contact Us</link>", isCode: true, correct: false },
          { text: "<img href=\"contact.html\" alt=\"Contact Us\">", isCode: true, correct: false }
        ],
        explanation: "Relative links to another HTML file in the same folder need the exact filename including .html."
      },
      {
        type: "mcq",
        topic: "Adding Images",
        badge: "Bug Hunt",
        question: "This image tag has THREE bugs preventing it from working properly. Which option fixes all of them?",
        code: "<image href=\"dog.jpg\" text=\"Cute puppy\">",
        options: [
          { text: "<img src=\"dog.jpg\" alt=\"Cute puppy\">", isCode: true, correct: true },
          { text: "<pic src=\"dog.jpg\" alt=\"Cute puppy\">", isCode: true, correct: false },
          { text: "<img href=\"dog.jpg\" title=\"Cute puppy\"></img>", isCode: true, correct: false },
          { text: "<image src=\"dog.jpg\" alt=\"Cute puppy\">", isCode: true, correct: false }
        ],
        explanation: "Images use the self-closing <img> tag (not <image>), src for the file path (not href), and alt for fallback text."
      },
      {
        type: "fill",
        topic: "Adding Images",
        badge: "Complete the Code",
        question: "Fill in the missing attribute name that provides fallback text if the image fails to load (and helps screen readers):",
        prefix: "<img src=\"sunset.jpg\" ",
        suffix: "=\"Orange sunset\">",
        placeholder: "attr",
        accepted: ["alt"],
        displayAnswer: "alt",
        explanation: "The alt (alternative text) attribute describes the image when it cannot be displayed."
      },
      {
        type: "builder",
        topic: "Adding Images",
        badge: "Build the Tag",
        question: "Click the code blocks in the right order to display cat.png with fallback text 'Cat':",
        tokens: ["alt=\"Cat\">", "<img", "src=\"cat.png\""],
        correctOrder: ["<img", "src=\"cat.png\"", "alt=\"Cat\">"],
        explanation: "An <img> tag opens with <img followed by its src and alt attributes and ends with > (no closing tag needed)."
      },
      {
        type: "mcq",
        topic: "Links + Images",
        badge: "Boss Challenge",
        question: "You want clicking on your site's logo image (logo.png) to take the user back to index.html. How do you combine <a> and <img> properly?",
        options: [
          { text: "<a href=\"index.html\"><img src=\"logo.png\" alt=\"Home\"></a>", isCode: true, correct: true },
          { text: "<img src=\"logo.png\" href=\"index.html\" alt=\"Home\">", isCode: true, correct: false },
          { text: "<a src=\"logo.png\" href=\"index.html\">Home</a>", isCode: true, correct: false },
          { text: "<img src=\"logo.png\"><a href=\"index.html\"></a></img>", isCode: true, correct: false }
        ],
        explanation: "Wrap the <img> element inside an <a href=\"...\">...</a> tag so the entire image becomes clickable!"
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];
    let selectedTokens = [];

    const progressBar = document.getElementById("progressBar");
    const questionCounter = document.getElementById("questionCounter");
    const scoreCounter = document.getElementById("scoreCounter");
    const quizBody = document.getElementById("quizBody");

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildFeedbackHTML(q, isCorrect) {
      let html = `<strong>${isCorrect ? "Spot on!" : "Not quite."}</strong> ${escapeHTML(q.explanation)}`;
      if (q.previewHTML) {
        html += `
          <div class="browser-preview">
            <div class="browser-bar">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <span style="margin-left:6px;">Mini Browser Preview &mdash; ${escapeHTML(q.previewTitle || "index.html")}</span>
            </div>
            <div class="browser-content">${q.previewHTML}</div>
          </div>
        `;
      }
      return html;
    }

    function renderQuestion() {
      const q = quizData[currentIndex];
      selectedTokens = [];

      progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
      questionCounter.textContent = `Challenge ${currentIndex + 1} of ${quizData.length}`;
      scoreCounter.textContent = `Score: ${score}`;

      let interactiveArea = "";

      if (q.type === "mcq") {
        const letters = ["A", "B", "C", "D"];
        const shuffledOptions = shuffleArray(q.options);
        q._renderedOptions = shuffledOptions;

        interactiveArea = `
          ${q.code ? `<pre class="code-snippet">${escapeHTML(q.code)}</pre>` : ""}
          <div class="options-list" id="optionsList">
            ${shuffledOptions
              .map(
                (opt, idx) => `
                <button class="option-btn" data-index="${idx}">
                  <span class="option-letter">${letters[idx]}</span>
                  <span class="${opt.isCode ? "option-code" : ""}">${escapeHTML(opt.text)}</span>
                </button>
              `
              )
              .join("")}
          </div>
        `;
      } else if (q.type === "fill") {
        interactiveArea = `
          <div class="inline-code-editor">
            <span>${escapeHTML(q.prefix)}</span>
            <input type="text" id="codeInput" class="code-input" placeholder="${escapeHTML(q.placeholder)}" autocomplete="off" spellcheck="false" />
            <span>${escapeHTML(q.suffix)}</span>
          </div>
          <div class="action-row">
            <button class="primary-btn" id="checkFillBtn">Check Answer</button>
          </div>
        `;
      } else if (q.type === "builder") {
        const shuffledTokens = shuffleArray(q.tokens);
        q._renderedTokens = shuffledTokens;

        interactiveArea = `
          <div class="builder-assembly" id="assemblyZone">
            <span style="font-size:0.88rem;">Click the code blocks below in order...</span>
          </div>
          <div class="builder-tokens" id="tokenPool">
            ${shuffledTokens
              .map(
                (tok, idx) => `
                <button class="token-chip" data-tok-idx="${idx}">${escapeHTML(tok)}</button>
              `
              )
              .join("")}
          </div>
          <div class="action-row">
            <button class="secondary-btn" id="clearBuilderBtn">Reset Blocks</button>
            <button class="primary-btn" id="checkBuilderBtn" disabled>Check Code</button>
          </div>
        `;
      }

      quizBody.innerHTML = `
        <div class="badge-row">
          <span class="topic-badge">${escapeHTML(q.topic)}</span>
          <span class="type-badge">${escapeHTML(q.badge)}</span>
        </div>
        <div class="question-text">${currentIndex + 1}. ${escapeHTML(q.question).replace(/\n/g, "<br>")}</div>
        ${interactiveArea}
        <div class="feedback-box" id="feedbackBox"></div>
        <div class="quiz-footer">
          <button class="primary-btn" id="nextBtn" disabled>
            ${currentIndex === quizData.length - 1 ? "See Final Results" : "Next Challenge"}
          </button>
        </div>
      `;

      if (q.type === "mcq") {
        quizBody.querySelectorAll(".option-btn").forEach((btn) => {
          btn.addEventListener("click", () => handleMCQ(Number(btn.dataset.index)));
        });
      } else if (q.type === "fill") {
        const inputEl = document.getElementById("codeInput");
        const checkBtn = document.getElementById("checkFillBtn");
        inputEl.focus();
        checkBtn.addEventListener("click", handleFill);
        inputEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !checkBtn.disabled) handleFill();
        });
      } else if (q.type === "builder") {
        setupBuilder(q);
      }

      document.getElementById("nextBtn").addEventListener("click", () => {
        currentIndex++;
        if (currentIndex < quizData.length) {
          renderQuestion();
        } else {
          showResults();
        }
      });
    }

    function handleMCQ(selectedIdx) {
      const q = quizData[currentIndex];
      const opts = q._renderedOptions;
      const buttons = quizBody.querySelectorAll(".option-btn");
      const isCorrect = opts[selectedIdx].correct;
      const correctObj = opts.find((o) => o.correct);

      if (isCorrect) {
        score++;
        scoreCounter.textContent = `Score: ${score}`;
      }

      userAnswers.push({
        question: q.question.split("\n")[0],
        chosen: opts[selectedIdx].text,
        correct: correctObj.text,
        isCorrect
      });

      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (opts[idx].correct) {
          btn.classList.add("correct");
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add("wrong");
        }
      });

      const feedbackBox = document.getElementById("feedbackBox");
      feedbackBox.className = `feedback-box show ${isCorrect ? "correct-fb" : "wrong-fb"}`;
      feedbackBox.innerHTML = buildFeedbackHTML(q, isCorrect);
      document.getElementById("nextBtn").disabled = false;
    }

    function handleFill() {
      const q = quizData[currentIndex];
      const inputEl = document.getElementById("codeInput");
      const checkBtn = document.getElementById("checkFillBtn");
      const rawVal = inputEl.value.trim();
      if (!rawVal) return;

      const normalized = rawVal.toLowerCase();
      const isCorrect = q.accepted.includes(normalized);

      inputEl.disabled = true;
      checkBtn.disabled = true;
      inputEl.classList.add(isCorrect ? "correct-input" : "wrong-input");

      if (isCorrect) {
        score++;
        scoreCounter.textContent = `Score: ${score}`;
      } else {
        inputEl.value = q.displayAnswer;
      }

      userAnswers.push({
        question: q.question,
        chosen: `${q.prefix}${rawVal}${q.suffix}`,
        correct: `${q.prefix}${q.displayAnswer}${q.suffix}`,
        isCorrect
      });

      const feedbackBox = document.getElementById("feedbackBox");
      feedbackBox.className = `feedback-box show ${isCorrect ? "correct-fb" : "wrong-fb"}`;
      feedbackBox.innerHTML = buildFeedbackHTML(q, isCorrect);
      document.getElementById("nextBtn").disabled = false;
    }

    function setupBuilder(q) {
      const assemblyZone = document.getElementById("assemblyZone");
      const tokenButtons = quizBody.querySelectorAll(".token-chip");
      const clearBtn = document.getElementById("clearBuilderBtn");
      const checkBtn = document.getElementById("checkBuilderBtn");

      function refreshAssembly() {
        if (selectedTokens.length === 0) {
          assemblyZone.innerHTML = `<span style="font-size:0.88rem;">Click the code blocks below in order...</span>`;
          checkBtn.disabled = true;
        } else {
          assemblyZone.innerHTML = selectedTokens
            .map((item) => `<span class="assembled-chip">${escapeHTML(item.text)}</span>`)
            .join("");
          checkBtn.disabled = selectedTokens.length !== q.correctOrder.length;
        }
      }

      tokenButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.tokIdx);
          btn.disabled = true;
          selectedTokens.push({ idx, text: q._renderedTokens[idx] });
          refreshAssembly();
        });
      });

      clearBtn.addEventListener("click", () => {
        selectedTokens = [];
        tokenButtons.forEach((b) => (b.disabled = false));
        refreshAssembly();
      });

      checkBtn.addEventListener("click", () => {
        clearBtn.disabled = true;
        checkBtn.disabled = true;
        tokenButtons.forEach((b) => (b.disabled = true));

        const userSeq = selectedTokens.map((t) => t.text);
        const isCorrect = JSON.stringify(userSeq) === JSON.stringify(q.correctOrder);

        assemblyZone.style.borderStyle = "solid";
        assemblyZone.style.borderColor = isCorrect ? "#22c55e" : "#ef4444";

        if (isCorrect) {
          score++;
          scoreCounter.textContent = `Score: ${score}`;
        }

        userAnswers.push({
          question: q.question,
          chosen: userSeq.join(" "),
          correct: q.correctOrder.join(" "),
          isCorrect
        });

        const feedbackBox = document.getElementById("feedbackBox");
        feedbackBox.className = `feedback-box show ${isCorrect ? "correct-fb" : "wrong-fb"}`;
        feedbackBox.innerHTML = buildFeedbackHTML(q, isCorrect);
        document.getElementById("nextBtn").disabled = false;
      });
    }

    function showResults() {
      const percentage = Math.round((score / quizData.length) * 100);
      let message = "Good start! Review the solutions below and try building the tags again.";
      if (percentage >= 90) message = "Outstanding! You can read, debug, and write core HTML tags up to links and images.";
      else if (percentage >= 70) message = "Great work! You have strong hands-on HTML problem-solving skills.";
      else if (percentage >= 50) message = "Solid effort! Check the missed bugs below and give it another run.";

      quizBody.innerHTML = `
        <div class="result-screen">
          <div class="score-circle">
            <span class="score-num">${score}/${quizData.length}</span>
            <span class="score-total">${percentage}%</span>
          </div>
          <h2 class="result-title">Lab Completed!</h2>
          <p class="result-msg">${message}</p>
          <button class="primary-btn" id="restartBtn">Play Again (New Shuffle)</button>

          <div class="review-list">
            ${userAnswers
              .map(
                (item, i) => `
                <div class="review-item ${item.isCorrect ? "ok" : "bad"}">
                  <strong>Q${i + 1}:</strong> ${escapeHTML(item.question)}<br />
                  <span>Your answer: <code class="inline">${escapeHTML(item.chosen)}</code></span>
                  ${
                    item.isCorrect
                      ? " &mdash; <strong>Correct</strong>"
                      : `<br /><span>Solution: <code class="inline">${escapeHTML(item.correct)}</code></span>`
                  }
                </div>
              `
              )
              .join("")}
          </div>
        </div>
      `;

      document.getElementById("restartBtn").addEventListener("click", () => {
        currentIndex = 0;
        score = 0;
        userAnswers = [];
        renderQuestion();
      });
    }

    renderQuestion();
  </script>
</body>
</html>
