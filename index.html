<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>National 5 Chemistry — Rate of Reaction Quiz</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#657084; --line:#dbe1ea; --accent:#2457c5; --soft:#f4f7fb; }
    * { box-sizing: border-box; }
    body { margin:0; background:#eef2f7; color:var(--ink); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .wrap { max-width:900px; margin:0 auto; padding:28px 16px 48px; }
    header { background:#172b4d; color:white; border-radius:18px; padding:28px; margin-bottom:20px; }
    header h1 { margin:0 0 8px; font-size:clamp(1.5rem,4vw,2.2rem); line-height:1.2; }
    header p { margin:0; color:#d8e2f2; }
    .meta { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:18px; font-size:.95rem; }
    .progress-shell { height:8px; background:#ffffff30; border-radius:99px; overflow:hidden; margin-top:10px; }
    #progress { height:100%; width:0; background:#8db6ff; transition:width .2s; }
    .question { background:white; border:1px solid var(--line); border-radius:14px; padding:20px; margin:14px 0; }
    .question h2 { font-size:1.08rem; margin:0 0 14px; }
    .options { display:grid; gap:9px; }
    label.option { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:10px; padding:11px 12px; cursor:pointer; }
    label.option:hover { background:#f8faff; border-color:#9bb6ed; }
    input[type=radio] { margin-top:5px; accent-color:var(--accent); }
    .option.correct { border-color:#16834a; background:#eefaf3; }
    .option.incorrect { border-color:#c53b42; background:#fff2f2; }
    .feedback { margin-top:12px; padding:12px; border-radius:9px; background:var(--soft); display:none; }
    .feedback.show { display:block; }
    .feedback strong { display:block; margin-bottom:3px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin:22px 0; }
    button { border:0; border-radius:10px; padding:12px 18px; font:inherit; font-weight:650; cursor:pointer; }
    #submit { background:var(--accent); color:white; }
    #reset { background:white; border:1px solid var(--line); color:var(--ink); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    #result { display:none; background:white; border:1px solid var(--line); border-radius:14px; padding:22px; margin-top:20px; }
    #result.show { display:block; }
    #score { font-size:2rem; font-weight:800; }
    .small { color:var(--muted); font-size:.92rem; }
    @media (max-width:560px) { header { padding:22px; } .question { padding:16px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>National 5 Chemistry</h1>
      <p>Rate of Reaction — Multiple-Choice Quiz</p>
      <div class="meta">
        <span>20 questions · 1 mark each</span>
        <span id="answered">0 of 20 answered</span>
      </div>
      <div class="progress-shell" aria-label="Quiz progress"><div id="progress"></div></div>
    </header>

    <form id="quiz">
      <div id="questions"></div>
      <div class="actions">
        <button type="submit" id="submit">Submit answers</button>
        <button type="button" id="reset">Reset quiz</button>
      </div>
    </form>

    <section id="result" aria-live="polite">
      <h2>Quiz result</h2>
      <div id="score"></div>
      <p id="message"></p>
      <p class="small">Correct answers and explanations are shown below each question.</p>
    </section>
  </main>

<script>
const questions = [
  { q:"Which of the following is an example of a chemical change?", options:["Melting ice","Frying a raw egg","Crumpling paper","Dissolving sugar in water"], answer:1, why:"Frying an egg produces new substances through chemical reactions." },
  { q:"Which observation is a definitive sign that a chemical reaction has taken place?", options:["A change in shape","A solid precipitate appears","A substance melts","A liquid evaporates"], answer:1, why:"A precipitate is a new insoluble solid formed by a chemical reaction." },
  { q:"As a chemical reaction proceeds over time, what happens to the amounts of reactants and products?", options:["Both decrease","Both increase","Reactants decrease and products increase","Reactants increase and products decrease"], answer:2, why:"Reactants are used up as products form." },
  { q:"According to collision theory, what must reactant particles do for a reaction to occur successfully?", options:["Collide at any speed","Collide with sufficient energy and correct orientation","Move slowly and remain together","Have the same mass"], answer:1, why:"Successful collisions require enough energy to overcome the activation energy and a suitable orientation." },
  { q:"How does increasing the concentration of an acid affect its reaction rate with magnesium?", options:["It slows the reaction","It stops the reaction","It speeds up the reaction","It has no effect"], answer:2, why:"Higher concentration means more acid particles per unit volume and more frequent successful collisions." },
  { q:"Which form of calcium carbonate reacts fastest with acid?", options:["Large marble chips","A single marble block","Fine calcium carbonate powder","A large calcium carbonate crystal"], answer:2, why:"Powder has a greater exposed surface area, allowing more collisions at the solid surface." },
  { q:"Why does increasing temperature usually increase reaction rate?", options:["Particles become larger","Particles move faster and collide more often with greater energy","Particles stop moving","Reactants become more concentrated"], answer:1, why:"At higher temperature, particles move faster and a greater proportion of collisions have enough energy to react." },
  { q:"Why is fresh food stored in a refrigerator?", options:["Low temperature speeds up reactions","Low temperature slows reactions that cause food to spoil","Low temperature increases particle size","Low temperature removes oxygen from food"], answer:1, why:"Cooling slows the chemical reactions and enzyme activity involved in food spoilage." },
  { q:"What does the rate of a chemical reaction measure?", options:["The total mass of reactants","The speed at which reactants are converted into products","The temperature of the mixture","The number of substances present"], answer:1, why:"Reaction rate describes how quickly reactants are used or products are formed." },
  { q:"Which list contains factors that directly affect reaction rate?", options:["Colour, mass, and volume","Concentration, temperature, particle size, and catalysts","Pressure, colour, and shape only","Density, mass, and melting point"], answer:1, why:"These factors affect collision frequency, collision energy, or the reaction pathway." },
  { q:"What is the main difference between a physical and chemical change?", options:["Physical changes always produce gas","Chemical changes create new substances","Physical changes are always irreversible","Chemical changes only occur at high temperatures"], answer:1, why:"A chemical change forms one or more new substances; a physical change does not." },
  { q:"Which is an example of a physical change?", options:["Burning wood","Rusting iron","Melting ice","Frying an egg"], answer:2, why:"Melting changes water's state but does not create a new substance." },
  { q:"What does fizzing or effervescence usually indicate during a reaction?", options:["A gas is being produced","A solid is melting","The reaction has stopped","The temperature is decreasing"], answer:0, why:"Bubbles are evidence that gas is being released." },
  { q:"What does concentration measure?", options:["The number of particles in a given volume","The total mass of a container","The temperature of a solution","The size of each particle"], answer:0, why:"Concentration describes the amount of solute or particles in a specified volume." },
  { q:"How does decreasing the particle size of a solid reactant affect its surface area?", options:["It decreases total surface area","It increases total surface area","It has no effect on surface area","It makes surface area zero"], answer:1, why:"Breaking a solid into smaller pieces exposes more total surface area." },
  { q:"Why does granulated sugar dissolve faster than a sugar cube in a hot drink?", options:["Granulated sugar is colder","Granulated sugar has a larger exposed surface area","Granulated sugar has fewer particles","Granulated sugar is chemically different"], answer:1, why:"Smaller grains expose more surface to the liquid, increasing contact and dissolving rate." },
  { q:"On a concentration-time graph, what shape does the reactant line usually take?", options:["A straight line increasing","A horizontal line","A curve decreasing and eventually becoming horizontal","A vertical line"], answer:2, why:"Reactant concentration falls as reactants are consumed, then levels off when the reaction stops." },
  { q:"When magnesium ribbon reacts with hydrochloric acid, what can be measured to determine the reaction rate?", options:["The time taken for the magnesium to disappear","The colour of the magnesium","The length of the test tube","The mass of the acid container"], answer:0, why:"The time for a fixed amount of magnesium to disappear can be used to compare reaction rates." },
  { q:"A measuring cylinder and delivery tube connected to a water trough are used in a reaction experiment. What is likely being measured?", options:["The mass of the reactant","The volume of gas produced over time","The colour change over time","The temperature of the gas"], answer:1, why:"Gas can be collected over water and its volume recorded at intervals." },
  { q:"What happens to reaction rate when reactant concentration decreases?", options:["The reaction speeds up","The reaction slows because collisions occur less frequently","The reaction rate stays the same","The reaction immediately stops"], answer:1, why:"Fewer reactant particles per unit volume generally means fewer successful collisions per second." }
];

const container = document.getElementById("questions");
const quiz = document.getElementById("quiz");
const submit = document.getElementById("submit");
const result = document.getElementById("result");

function render() {
  container.innerHTML = questions.map((item, i) => `
    <section class="question" id="question-${i}">
      <h2>${i+1}. ${item.q}</h2>
      <div class="options">
        ${item.options.map((option, j) => `
          <label class="option" data-option="${j}">
            <input type="radio" name="q${i}" value="${j}">
            <span><strong>${String.fromCharCode(65+j)}.</strong> ${option}</span>
          </label>`).join("")}
      </div>
      <div class="feedback" id="feedback-${i}"></div>
    </section>`).join("");
}

function updateProgress() {
  const count = questions.filter((_, i) => quiz.querySelector(`input[name="q${i}"]:checked`)).length;
  document.getElementById("answered").textContent = `${count} of ${questions.length} answered`;
  document.getElementById("progress").style.width = `${count/questions.length*100}%`;
}
quiz.addEventListener("change", updateProgress);

quiz.addEventListener("submit", event => {
  event.preventDefault();
  let score = 0;
  questions.forEach((item, i) => {
    const selected = quiz.querySelector(`input[name="q${i}"]:checked`);
    const section = document.getElementById(`question-${i}`);
    const feedback = document.getElementById(`feedback-${i}`);
    section.querySelectorAll(".option").forEach((label, j) => {
      label.classList.remove("correct", "incorrect");
      if (j === item.answer) label.classList.add("correct");
      if (selected && j === Number(selected.value) && j !== item.answer) label.classList.add("incorrect");
    });
    const isCorrect = selected && Number(selected.value) === item.answer;
    if (isCorrect) score++;
    feedback.className = "feedback show";
    feedback.innerHTML = `<strong>${isCorrect ? "Correct — 1/1 mark" : "Incorrect — 0/1 marks"}${!selected ? " (unanswered)" : ""}</strong><div><b>Correct answer:</b> ${String.fromCharCode(65+item.answer)}. ${item.options[item.answer]}</div><div>${item.why}</div>`;
  });
  document.getElementById("score").textContent = `Your mark: ${score} / ${questions.length} (${Math.round(score/questions.length*100)}%)`;
  document.getElementById("message").textContent = score >= 16 ? "Excellent work! You have a strong grasp of reaction rates." : score >= 10 ? "Good effort. Review the explanations for the questions you missed." : "Keep practising. Review the explanations and try the quiz again.";
  result.classList.add("show");
  submit.disabled = true;
  quiz.querySelectorAll("input").forEach(input => input.disabled = true);
  result.scrollIntoView({behavior:"smooth", block:"start"});
});

document.getElementById("reset").addEventListener("click", () => {
  quiz.reset();
  submit.disabled = false;
  quiz.querySelectorAll("input").forEach(input => input.disabled = false);
  result.classList.remove("show");
  questions.forEach((_, i) => {
    document.getElementById(`feedback-${i}`).className = "feedback";
    document.getElementById(`feedback-${i}`).textContent = "";
    document.querySelectorAll(`#question-${i} .option`).forEach(label => label.classList.remove("correct","incorrect"));
  });
  updateProgress();
  window.scrollTo({top:0, behavior:"smooth"});
});

render();
updateProgress();
</script>
</body>
</html>
