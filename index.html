<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic HTML Tags Quiz (Up to Links & Images)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .quiz-container {
      background: #ffffff;
      width: 100%;
      max-width: 680px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(30, 41, 59, 0.12);
      overflow: hidden;
    }

    .quiz-header {
      background: #2563eb;
      color: #ffffff;
      padding: 24px 28px;
    }

    .quiz-header h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .quiz-header p {
      font-size: 0.92rem;
      opacity: 0.9;
    }

    .progress-bar-wrap {
      background: rgba(255, 255, 255, 0.25);
      height: 8px;
      border-radius: 999px;
      margin-top: 16px;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: #fde047;
      height: 100%;
      width: 5%;
      transition: width 0.3s ease;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-top: 8px;
      font-weight: 600;
    }

    .quiz-body {
      padding: 28px;
    }

    .topic-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 20px;
      line-height: 1.45;
    }

    code {
      background: #f1f5f9;
      color: #be123c;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.95em;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 1rem;
      color: #1e293b;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #2563eb;
      background: #eff6ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #14532d;
      font-weight: 600;
    }

    .option-btn.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #7f1d1d;
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-btn.correct .option-letter {
      background: #16a34a;
      color: #ffffff;
    }

    .option-btn.wrong .option-letter {
      background: #dc2626;
      color: #ffffff;
    }

    .feedback-box {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.94rem;
      line-height: 1.45;
      display: none;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.correct-fb {
      background: #f0fdf4;
      border-left: 4px solid #16a34a;
      color: #166534;
    }

    .feedback-box.wrong-fb {
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #991b1b;
    }

    .quiz-footer {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .primary-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .primary-btn:hover:not(:disabled) {
      background: #1d4ed8;
    }

    .primary-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .result-screen {
      text-align: center;
      padding: 12px 0;
    }

    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #eff6ff;
      border: 6px solid #2563eb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
    }

    .score-circle .score-num {
      font-size: 2rem;
      font-weight: 800;
      color: #1d4ed8;
    }

    .score-circle .score-total {
      font-size: 0.9rem;
      color: #475569;
      font-weight: 600;
    }

    .result-title {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .result-msg {
      color: #475569;
      margin-bottom: 24px;
      font-size: 1rem;
    }

    .review-list {
      text-align: left;
      margin-top: 24px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
      max-height: 320px;
      overflow-y: auto;
    }

    .review-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      background: #f8fafc;
      border-left: 4px solid #cbd5e1;
    }

    .review-item.ok {
      border-left-color: #16a34a;
    }

    .review-item.bad {
      border-left-color: #dc2626;
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <div class="quiz-header">
      <h1>Basic HTML Tags Quiz</h1>
      <p>Easy Level &bull; 20 Questions (Structure, Text, Lists, Links &amp; Images)</p>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-row">
        <span id="questionCounter">Question 1 of 20</span>
        <span id="scoreCounter">Score: 0</span>
      </div>
    </div>

    <div class="quiz-body" id="quizBody">
      <span class="topic-badge" id="topicBadge">HTML Basics</span>
      <div class="question-text" id="questionText"></div>
      <div class="options-list" id="optionsList"></div>
      <div class="feedback-box" id="feedbackBox"></div>
      <div class="quiz-footer">
        <button class="primary-btn" id="nextBtn" disabled>Next Question</button>
      </div>
    </div>
  </div>

  <script>
    const quizData = [
      {
        topic: "HTML Basics",
        question: "What does HTML stand for?",
        options: [
          "Hyper Text Markup Language",
          "High Tech Modern Language",
          "Home Tool Markup Language",
          "Hyperlink and Text Management Language"
        ],
        answer: 0,
        explanation: "HTML stands for Hyper Text Markup Language, the standard language for creating web pages."
      },
      {
        topic: "Document Structure",
        question: "Which declaration defines that a document is an HTML5 page?",
        options: [
          "<!DOCTYPE html>",
          "<html5>",
          "<!HTML>",
          "<doctype>"
        ],
        answer: 0,
        explanation: "<!DOCTYPE html> is placed at the very top of the file to tell the browser this is an HTML5 document."
      },
      {
        topic: "Document Structure",
        question: "Which tag is the root element that wraps all content on an HTML page?",
        options: [
          "<html>",
          "<head>",
          "<body>",
          "<page>"
        ],
        answer: 0,
        explanation: "The <html> tag is the root container for the entire HTML document."
      },
      {
        topic: "Document Structure",
        question: "Where should the <title> tag be placed in an HTML file?",
        options: [
          "Inside the <head> tag",
          "Inside the <body> tag",
          "Inside the <h1> tag",
          "After the </html> tag"
        ],
        answer: 0,
        explanation: "The <title> tag goes inside <head> and sets the title shown on the browser tab."
      },
      {
        topic: "Document Structure",
        question: "Which tag holds all the visible content of a web page (headings, text, links, images)?",
        options: [
          "<body>",
          "<head>",
          "<title>",
          "<meta>"
        ],
        answer: 0,
        explanation: "Everything visible on the web page goes inside the <body> element."
      },
      {
        topic: "Headings",
        question: "Which HTML tag creates the largest and most important heading?",
        options: [
          "<h1>",
          "<h6>",
          "<head>",
          "<heading>"
        ],
        answer: 0,
        explanation: "<h1> defines the main (largest) heading, while <h6> defines the smallest heading."
      },
      {
        topic: "Headings",
        question: "Which HTML tag defines the smallest heading level?",
        options: [
          "<h6>",
          "<h1>",
          "<h3>",
          "<small>"
        ],
        answer: 0,
        explanation: "HTML headings range from <h1> (largest) down to <h6> (smallest)."
      },
      {
        topic: "Paragraphs & Breaks",
        question: "Which tag is used to create a paragraph in HTML?",
        options: [
          "<p>",
          "<para>",
          "<pg>",
          "<text>"
        ],
        answer: 0,
        explanation: "The <p> tag defines a paragraph and automatically adds space before and after it."
      },
      {
        topic: "Paragraphs & Breaks",
        question: "Which empty tag inserts a single line break without starting a new paragraph?",
        options: [
          "<br>",
          "<lb>",
          "<break>",
          "<hr>"
        ],
        answer: 0,
        explanation: "<br> creates a line break and does not require a closing tag."
      },
      {
        topic: "Paragraphs & Breaks",
        question: "Which tag draws a horizontal line across the web page?",
        options: [
          "<hr>",
          "<line>",
          "<br>",
          "<hl>"
        ],
        answer: 0,
        explanation: "The <hr> (horizontal rule) tag creates a horizontal divider line."
      },
      {
        topic: "Text Formatting",
        question: "Which tag is used to make text bold?",
        options: [
          "<b>",
          "<bold>",
          "<i>",
          "<u>"
        ],
        answer: 0,
        explanation: "The <b> tag (or <strong>) displays text in bold."
      },
      {
        topic: "Text Formatting",
        question: "Which tag displays text in italics?",
        options: [
          "<i>",
          "<italic>",
          "<b>",
          "<ul>"
        ],
        answer: 0,
        explanation: "The <i> tag (or <em>) formats text in italics."
      },
      {
        topic: "Text Formatting",
        question: "Which tag is used to underline text in HTML?",
        options: [
          "<u>",
          "<underline>",
          "<ul_text>",
          "<line>"
        ],
        answer: 0,
        explanation: "The <u> tag underlines the enclosed text."
      },
      {
        topic: "Lists",
        question: "Which tag creates a bulleted (unordered) list?",
        options: [
          "<ul>",
          "<ol>",
          "<li>",
          "<list>"
        ],
        answer: 0,
        explanation: "<ul> stands for unordered list and displays items with bullets."
      },
      {
        topic: "Lists",
        question: "Which tag defines each item inside a <ul> or <ol> list?",
        options: [
          "<li>",
          "<ul>",
          "<ol>",
          "<item>"
        ],
        answer: 0,
        explanation: "<li> stands for list item and is used inside both <ul> and <ol>."
      },
      {
        topic: "Adding Links",
        question: "Which HTML tag is used to create a clickable link?",
        options: [
          "<a>",
          "<link>",
          "<href>",
          "<url>"
        ],
        answer: 0,
        explanation: "The <a> (anchor) tag is used to create hyperlinks."
      },
      {
        topic: "Adding Links",
        question: "Which attribute in the <a> tag specifies the destination web address (URL)?",
        options: [
          "href",
          "src",
          "alt",
          "link"
        ],
        answer: 0,
        explanation: "The href attribute holds the URL, such as <a href=\"https://example.com\">Visit</a>."
      },
      {
        topic: "Adding Links",
        question: "Which attribute makes a link open in a new browser tab?",
        options: [
          "target=\"_blank\"",
          "target=\"_self\"",
          "open=\"new\"",
          "tab=\"new\""
        ],
        answer: 0,
        explanation: "Adding target=\"_blank\" to an <a> tag opens the link in a new tab."
      },
      {
        topic: "Adding Images",
        question: "Which HTML tag is used to embed an image on a web page?",
        options: [
          "<img>",
          "<image>",
          "<pic>",
          "<photo>"
        ],
        answer: 0,
        explanation: "The <img> tag is used to display images and is self-closing."
      },
      {
        topic: "Adding Images",
        question: "Which two attributes are essential in an <img> tag for the file path and fallback description?",
        options: [
          "src and alt",
          "href and title",
          "url and text",
          "link and name"
        ],
        answer: 0,
        explanation: "src specifies the image file path/URL, and alt provides alternative text if the image cannot load."
      }
    ];

    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    const progressBar = document.getElementById("progressBar");
    const questionCounter = document.getElementById("questionCounter");
    const scoreCounter = document.getElementById("scoreCounter");
    const quizBody = document.getElementById("quizBody");

    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderQuestion() {
      const q = quizData[currentIndex];
      const letters = ["A", "B", "C", "D"];

      progressBar.style.width = `${((currentIndex + 1) / quizData.length) * 100}%`;
      questionCounter.textContent = `Question ${currentIndex + 1} of ${quizData.length}`;
      scoreCounter.textContent = `Score: ${score}`;

      quizBody.innerHTML = `
        <span class="topic-badge">${escapeHTML(q.topic)}</span>
        <div class="question-text">${currentIndex + 1}. ${escapeHTML(q.question)}</div>
        <div class="options-list" id="optionsList">
          ${q.options
            .map(
              (opt, idx) => `
              <button class="option-btn" data-index="${idx}">
                <span class="option-letter">${letters[idx]}</span>
                <span>${escapeHTML(opt)}</span>
              </button>
            `
            )
            .join("")}
        </div>
        <div class="feedback-box" id="feedbackBox"></div>
        <div class="quiz-footer">
          <button class="primary-btn" id="nextBtn" disabled>
            ${currentIndex === quizData.length - 1 ? "See Results" : "Next Question"}
          </button>
        </div>
      `;

      const optionButtons = quizBody.querySelectorAll(".option-btn");
      optionButtons.forEach((btn) => {
        btn.addEventListener("click", () => handleSelect(Number(btn.dataset.index)));
      });

      document.getElementById("nextBtn").addEventListener("click", () => {
        currentIndex++;
        if (currentIndex < quizData.length) {
          renderQuestion();
        } else {
          showResults();
        }
      });
    }

    function handleSelect(selectedIdx) {
      const q = quizData[currentIndex];
      const optionButtons = quizBody.querySelectorAll(".option-btn");
      const feedbackBox = document.getElementById("feedbackBox");
      const nextBtn = document.getElementById("nextBtn");

      const isCorrect = selectedIdx === q.answer;
      if (isCorrect) {
        score++;
        scoreCounter.textContent = `Score: ${score}`;
      }

      userAnswers.push({
        question: q.question,
        chosen: q.options[selectedIdx],
        correct: q.options[q.answer],
        isCorrect
      });

      optionButtons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.classList.add("correct");
        } else if (idx === selectedIdx && !isCorrect) {
          btn.classList.add("wrong");
        }
      });

      feedbackBox.className = `feedback-box show ${isCorrect ? "correct-fb" : "wrong-fb"}`;
      feedbackBox.textContent = `${isCorrect ? "Correct!" : "Not quite."} ${q.explanation}`;
      nextBtn.disabled = false;
    }

    function showResults() {
      const percentage = Math.round((score / quizData.length) * 100);
      let message = "Keep practicing the basic HTML tags and try again!";
      if (percentage >= 90) message = "Outstanding! You have mastered basic HTML tags up to links and images.";
      else if (percentage >= 70) message = "Great job! You have a solid understanding of basic HTML tags.";
      else if (percentage >= 50) message = "Good effort! Review the missed tags below and try again.";

      quizBody.innerHTML = `
        <div class="result-screen">
          <div class="score-circle">
            <span class="score-num">${score}/${quizData.length}</span>
            <span class="score-total">${percentage}%</span>
          </div>
          <h2 class="result-title">Quiz Completed!</h2>
          <p class="result-msg">${message}</p>
          <button class="primary-btn" id="restartBtn">Restart Quiz</button>

          <div class="review-list">
            ${userAnswers
              .map(
                (item, i) => `
                <div class="review-item ${item.isCorrect ? "ok" : "bad"}">
                  <strong>Q${i + 1}:</strong> ${escapeHTML(item.question)}<br />
                  <span>Your answer: <code>${escapeHTML(item.chosen)}</code></span>
                  ${
                    item.isCorrect
                      ? " &mdash; <strong>Correct</strong>"
                      : `<br /><span>Correct answer: <code>${escapeHTML(item.correct)}</code></span>`
                  }
                </div>
              `
              )
              .join("")}
          </div>
        </div>
      `;

      document.getElementById("restartBtn").addEventListener("click", () => {
        currentIndex = 0;
        score = 0;
        userAnswers = [];
        renderQuestion();
      });
    }

    renderQuestion();
  </script>
</body>
</html>
